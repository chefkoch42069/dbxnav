<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>D-Ticket Reiseplaner</title>
  <meta name="description" content="Mit dem Deutschlandticket durchs Land: Tagestrips, Wochenenden und Mehrtagestouren im Nahverkehr, mit Unterkünften bis 50 € pro Nacht.">
  <meta name="theme-color" content="#0f5132">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true">D</span><span>Reiseplaner</span></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="plan" aria-selected="true"><span class="ico" aria-hidden="true">🧭</span><span class="lbl-long">Planen</span><span class="lbl-short" aria-hidden="true">Planen</span></button>
      <button role="tab" data-tab="board"><span class="ico" aria-hidden="true">🚉</span><span class="lbl-long">Abfahrten</span><span class="lbl-short" aria-hidden="true">Züge</span></button>
      <button role="tab" data-tab="intl"><span class="ico" aria-hidden="true">🌍</span><span class="lbl-long">International</span><span class="lbl-short" aria-hidden="true">Europa</span></button>
      <button role="tab" data-tab="city"><span class="ico" aria-hidden="true">🏙️</span><span class="lbl-long">Stadt</span><span class="lbl-short" aria-hidden="true">Stadt</span></button>
      <button role="tab" data-tab="budget"><span class="ico" aria-hidden="true">🥖</span><span class="lbl-long">Homeless-Modus</span><span class="lbl-short" aria-hidden="true">Gratis</span></button>
      <button role="tab" data-tab="youtuber"><span class="ico" aria-hidden="true">🎥</span><span class="lbl-long">YouTuber</span><span class="lbl-short" aria-hidden="true">Video</span></button>
      <button role="tab" data-tab="collect"><span class="ico" aria-hidden="true">🏅</span><span class="lbl-long">Sammler</span><span class="lbl-short" aria-hidden="true">Länder</span></button>
      <button role="tab" data-tab="saved"><span class="ico" aria-hidden="true">☆</span><span class="lbl-long">Merkliste</span><span class="lbl-short" aria-hidden="true">Merken</span></button>
    </nav>
  </header>
  <main class="layout">
    <aside class="panel" id="panel">
      <button class="panel-grip" id="panelGrip" aria-label="Seitenleiste ein-/ausklappen"></button>
      <section data-panel="plan" id="tab-plan"></section>
      <section data-panel="board" id="tab-board" hidden></section>
      <section data-panel="intl" id="tab-intl" hidden></section>
      <section data-panel="city" id="tab-city" hidden></section>
      <section data-panel="budget" id="tab-budget" hidden></section>
      <section data-panel="youtuber" id="tab-youtuber" hidden></section>
      <section data-panel="collect" id="tab-collect" hidden></section>
      <section data-panel="saved" id="tab-saved" hidden></section>
    </aside>
    <div id="map" role="application" aria-label="Karte"></div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
